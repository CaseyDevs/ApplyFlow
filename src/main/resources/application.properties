spring.application.name=ApplyFlow

# RSA Key Configuration for JWT
# IMPORTANT: Store actual key files in ~/.applyflow/certs/ (not in repo)
# Use environment variables or application-local.properties for local development
rsa.private-key=file:${user.home}/.applyflow/certs/private.pem
rsa.public-key=file:${user.home}/.applyflow/certs/public.pem

# JWT Settings

# 1hr expiry
jwt.expiration-ms=3600000