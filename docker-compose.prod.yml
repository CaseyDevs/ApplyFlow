services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-applyflow}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - applyflow-network

  backend:
    image: ${BACKEND_IMAGE:-applyflow-backend:prod}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database configuration
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-applyflow}
      DB_USERNAME: ${DB_USERNAME:?Database username required}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      
      # Email configuration (Gmail SMTP)
      MAIL_USERNAME: ${MAIL_USERNAME:?Email username required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Email app password required}

      SPRING_PROFILES_ACTIVE: prod
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Frontend URL required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Allowed CORS origins required}

    secrets:
      - jwt-private.pem
      - jwt-public.pem
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - applyflow-network
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-applyflow-frontend:prod}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Public API URL required}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - applyflow-network
    restart: unless-stopped

secrets:
  jwt-private.pem:
    file: ./secrets/jwt-private.pem
  jwt-public.pem:
    file: ./secrets/jwt-public.pem

volumes:
  db_data_prod:
    driver: local

networks:
  applyflow-network:
    driver: bridge
